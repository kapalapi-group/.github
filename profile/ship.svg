<svg width="1000" height="250" viewBox="0 0 1000 250" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes ship-move {
      0% { transform: translateX(-100px); }
      50% { transform: translateX(100px); }
      100% { transform: translateX(-100px); }
    }
    @keyframes bobbing {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-4px) rotate(0.5deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes wave-move {
      0% { transform: translateX(0px); }
      100% { transform: translateX(-100px); }
    }
    @keyframes smoke-float {
      0% { transform: translateY(0) scale(1); opacity: 0; }
      20% { opacity: 0.6; }
      100% { transform: translateY(-40px) scale(2); opacity: 0; }
    }
    .ship-container {
      animation: ship-move 12s ease-in-out infinite;
    }
    .ship-bob {
      animation: bobbing 3s ease-in-out infinite;
    }
    .hull { fill: #1a1a1a; }
    .deck { fill: #ecf0f1; }
    .funnel { fill: #f39c12; }
    .funnel-top { fill: #2c3e50; }
    .window { fill: #f1c40f; opacity: 0.8; }
    .smoke { fill: #bdc3c7; animation: smoke-float 2s linear infinite; }
    .kag-text { font-family: Arial, sans-serif; font-weight: bold; fill: #ffffff; font-size: 14px; }
  </style>

  <!-- Ombak di Background -->
  <g class="waves" style="animation: wave-move 3s linear infinite; fill: #2980b9; opacity: 0.5;">
    <path d="M0 210 Q25 200 50 210 T100 210 T150 210 T200 210 T250 210 T300 210 T350 210 T400 210 T450 210 T500 210 T550 210 T600 210 T650 210 T700 210 T750 210 T800 210 T850 210 T900 210 T950 210 T1000 210 T1050 210 T1100 210 V250 H0 Z" />
  </g>

  <g class="ship-container">
    <g class="ship-bob">
      <!-- Smoke -->
      <circle class="smoke" cx="440" cy="60" r="4" />
      <circle class="smoke" cx="480" cy="60" r="4" style="animation-delay: 0.5s" />
      <circle class="smoke" cx="520" cy="60" r="4" style="animation-delay: 1s" />
      <circle class="smoke" cx="560" cy="60" r="4" style="animation-delay: 1.5s" />

      <!-- Cerobong (Funnels) -->
      <rect class="funnel" x="430" y="60" width="15" height="40" transform="skewX(-5)" />
      <rect class="funnel-top" x="428" y="60" width="15" height="8" transform="skewX(-5)" />
      
      <rect class="funnel" x="470" y="60" width="15" height="40" transform="skewX(-5)" />
      <rect class="funnel-top" x="468" y="60" width="15" height="8" transform="skewX(-5)" />

      <rect class="funnel" x="510" y="60" width="15" height="40" transform="skewX(-5)" />
      <rect class="funnel-top" x="508" y="60" width="15" height="8" transform="skewX(-5)" />

      <rect class="funnel" x="550" y="60" width="15" height="40" transform="skewX(-5)" />
      <rect class="funnel-top" x="548" y="60" width="15" height="8" transform="skewX(-5)" />

      <!-- Superstructure (Decks) -->
      <rect class="deck" x="380" y="100" width="240" height="40" rx="2" />
      <rect class="deck" x="400" y="85" width="200" height="15" rx="2" />
      
      <!-- Windows -->
      <rect class="window" x="390" y="110" width="5" height="5" />
      <rect class="window" x="410" y="110" width="5" height="5" />
      <rect class="window" x="430" y="110" width="5" height="5" />
      <rect class="window" x="450" y="110" width="5" height="5" />
      <rect class="window" x="470" y="110" width="5" height="5" />
      <rect class="window" x="490" y="110" width="5" height="5" />
      <rect class="window" x="510" y="110" width="5" height="5" />
      <rect class="window" x="530" y="110" width="5" height="5" />
      <rect class="window" x="550" y="110" width="5" height="5" />
      <rect class="window" x="570" y="110" width="5" height="5" />
      <rect class="window" x="590" y="110" width="5" height="5" />

      <!-- Hull (Badan Kapal) -->
      <path class="hull" d="M300 140 L700 140 L680 190 L350 190 Z" />
      <path class="hull" d="M300 140 Q250 140 230 140 L280 190 Q300 190 350 190" /> <!-- Bow (Depan) -->
      
      <!-- Branding -->
      <text x="435" y="170" class="kag-text">KAPAL API GLOBAL</text>
    </g>
  </g>

  <!-- Ombak Depan -->
  <g class="waves" style="animation: wave-move 2s linear infinite; fill: #3498db;">
    <path d="M0 220 Q25 210 50 220 T100 220 T150 220 T200 220 T250 220 T300 220 T350 220 T400 220 T450 220 T500 220 T550 220 T600 220 T650 220 T700 220 T750 220 T800 220 T850 220 T900 220 T950 220 T1000 220 T1050 220 T1100 220 V250 H0 Z" />
  </g>
</svg>
