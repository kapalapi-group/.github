<svg width="800" height="180" viewBox="0 0 800 180" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes ship-move {
      0% { transform: translateX(-50px); }
      50% { transform: translateX(50px); }
      100% { transform: translateX(-50px); }
    }
    @keyframes bobbing {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
      100% { transform: translateY(0px); }
    }
    @keyframes wave-move {
      0% { transform: translateX(0px); }
      100% { transform: translateX(-100px); }
    }
    .ship-container {
      animation: ship-move 10s ease-in-out infinite;
    }
    .ship-body {
      animation: bobbing 2s ease-in-out infinite;
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
      fill: #2ecc71;
      white-space: pre;
    }
    .waves {
      animation: wave-move 2s linear infinite;
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
      fill: #3498db;
      white-space: pre;
    }
  </style>
  
  <!-- Kapal bergerak kiri ke kanan (dengan efek goyang) -->
  <g class="ship-container">
    <g class="ship-body">
      <text x="300" y="30">              |    |    |</text>
      <text x="300" y="45">             )_)  )_)  )_)</text>
      <text x="300" y="60">            )___))___))___)\</text>
      <text x="300" y="75">           )____)____)_____)\\</text>
      <text x="300" y="90">         _____|____|____|____\\\__</text>
      <text x="300" y="105">---------\       K  A  G         /---------</text>
    </g>
  </g>

  <!-- Air bergerak kanan ke kiri -->
  <g class="waves">
    <text x="0" y="125">^^^^^ ^^^^^ ^^^^^ ^^^^^ ^^^^^ ^^^^^ ^^^^^ ^^^^^ ^^^^^ ^^^^^ ^^^^^ ^^^^^ ^^^^^ ^^^^^ ^^^^^</text>
    <text x="0" y="130"> ^^^^^ ^^^^^ ^^^^^ ^^^^^ ^^^^^ ^^^^^ ^^^^^ ^^^^^ ^^^^^ ^^^^^ ^^^^^ ^^^^^ ^^^^^ ^^^^^ ^^^^^</text>
    <text x="0" y="135">^^^^^ ^^^^^ ^^^^^ ^^^^^ ^^^^^ ^^^^^ ^^^^^ ^^^^^ ^^^^^ ^^^^^ ^^^^^ ^^^^^ ^^^^^ ^^^^^ ^^^^^</text>
  </g>
</svg>
