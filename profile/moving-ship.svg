<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="240">
  <style>
    .ascii-pre {
      margin: 0;
      font-family: Consolas, "Courier New", Courier, monospace;
      font-size: 14px;
      font-weight: bold;
      line-height: 1.2;
      background: transparent;
      border: none;
      color: #24292f;
    }
    @media (prefers-color-scheme: dark) {
      .ascii-pre {
        color: #adbac7;
      }
    }
    .ship {
      animation: bob 4s ease-in-out infinite;
      transform-origin: 400px 100px;
    }
    .waves {
      animation: drift 3s ease-in-out infinite;
    }
    @keyframes bob {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(6px) rotate(1deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes drift {
      0% { transform: translateX(0px); }
      50% { transform: translateX(-15px); }
      100% { transform: translateX(0px); }
    }
  </style>
  
  <foreignObject x="0" y="0" width="800" height="240">
    <div xmlns="http://www.w3.org/1999/xhtml" style="width: 100%; height: 100%; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center;">
      <!-- Ship -->
      <div class="ship" style="position: absolute; top: 15px; width: 100%; text-align: center;">
        <pre class="ascii-pre">
                      .  .  .
                    .  .  .  .
                   .  .  .  .  .
                  ______
                _|_|__|_|__
              _|___________|_
    __________|___o___o___o_|___________
    \                                   /
     \_________________________________/
        </pre>
      </div>
      <!-- Waves -->
      <div class="waves" style="position: absolute; top: 150px; width: 120%; text-align: center; left: -10%;">
        <pre class="ascii-pre">
~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
        </pre>
      </div>
    </div>
  </foreignObject>
</svg>
